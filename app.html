<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1b1c1f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PyCep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<title>PyCep Editor - Write and run Python</title>
<meta name="description" content="The PyCep editor: write, run and save Python code in your browser on your phone, tablet or computer.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: toolbar, file tabs, touch key row, then editor over console (stacked on phones, side by side on wide landscape) */
:root {
  --bg: #eef0f3; --bar: #e4e7ec; --ed: #ffffff; --gut: #f3f4f7; --cons: #fbfbfc;
  --fg: #1d2330; --mut: #586174; --line: #cfd4dc;
  --sel: rgba(37, 99, 201, 0.26); --cur: #f1f5fc;
  --accent: #2563c9; --accent-fg: #ffffff;
  --run: #23772f; --run-fg: #ffffff; --stop: #c62f2f; --warn: #8a5a00;
  --k: #0033b3; --s: #067d17; --c: #727887; --n: #1750eb; --f: #00627a; --t: #1f6f6f;
  --b: #7a2e8f; --d: #8a6d00; --p: #94558d;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs: 14px; --lh: 22px; --tap: 36px;
  color-scheme: light;
}
@media (pointer: coarse) { :root { --fs: 16px; --lh: 25px; --tap: 40px; } }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1f; --bar: #2b2d30; --ed: #2b2b2b; --gut: #313335; --cons: #1e1f22;
    --fg: #a9b7c6; --mut: #8b929d; --line: #43464a;
    --sel: rgba(74, 156, 240, 0.35); --cur: #323232;
    --accent: #4a9cf0; --accent-fg: #0b1b2e;
    --run: #5fb760; --run-fg: #0d1f0e; --stop: #ef6b64; --warn: #e0b04c;
    --k: #cc7832; --s: #6a8759; --c: #808080; --n: #6897bb; --f: #ffc66d; --t: #e8bf6a;
    --b: #8888c6; --d: #bbb529; --p: #b88ab3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c1f; --bar: #2b2d30; --ed: #2b2b2b; --gut: #313335; --cons: #1e1f22;
  --fg: #a9b7c6; --mut: #8b929d; --line: #43464a;
  --sel: rgba(74, 156, 240, 0.35); --cur: #323232;
  --accent: #4a9cf0; --accent-fg: #0b1b2e;
  --run: #5fb760; --run-fg: #0d1f0e; --stop: #ef6b64; --warn: #e0b04c;
  --k: #cc7832; --s: #6a8759; --c: #808080; --n: #6897bb; --f: #ffc66d; --t: #e8bf6a;
  --b: #8888c6; --d: #bbb529; --p: #b88ab3;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
html { position: fixed; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100%); }
html.kb { padding-bottom: 0; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; gap: 6px; height: 100%; padding-block: 8px; }

/* Toolbar */
.bar { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo {
  width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-fg);
  font: 700 13px var(--mono); letter-spacing: -0.02em; flex: 0 0 auto;
}
.brand-name { font: 600 15px var(--ui); letter-spacing: -0.01em; }
svg.logo { background: none; border-radius: 0; }
.spacer { flex: 1 1 0; min-width: 0; }
.icon-btn {
  height: var(--tap); min-width: var(--tap); padding: 0 6px; border-radius: 8px;
  background: transparent; border: 1px solid var(--line); color: var(--fg);
  display: inline-grid; place-items: center; font: 600 13px var(--ui);
}
.icon-btn:active { background: var(--bar); }
.sel-wrap { position: relative; display: inline-block; flex: 0 0 auto; }
.sel-wrap select {
  appearance: none; -webkit-appearance: none; height: var(--tap); width: 104px;
  padding: 0 24px 0 10px; border-radius: 8px; background: transparent;
  border: 1px solid var(--line); color: var(--fg); font: 500 13px var(--ui);
}
.sel-wrap select option { background: var(--ed); color: var(--fg); }
.sel-wrap::after {
  content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px;
  border-right: 2px solid var(--mut); border-bottom: 2px solid var(--mut);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
.run {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--tap); padding: 0 14px; border: 0; border-radius: 8px; flex: 0 0 auto;
  background: var(--run); color: var(--run-fg); font: 600 14px var(--ui);
}
.run.stop { background: var(--stop); }
.run:disabled { opacity: 0.5; cursor: default; }

/* File tabs */
.tabs {
  display: flex; align-items: flex-end; gap: 2px; flex: 0 0 auto; overflow-x: auto;
  border-bottom: 1px solid var(--line); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; height: 34px; flex: 0 0 auto; border-radius: 6px 6px 0 0; color: var(--mut); }
.tab.active { background: var(--ed); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.tab-name { height: 100%; padding: 0 12px; background: none; border: 0; font: 500 13px var(--mono); color: inherit; }
.tab.active .tab-name { padding-right: 4px; }
.tab-x {
  height: 26px; min-width: 26px; margin-right: 6px; padding: 0 6px; border-radius: 6px;
  background: none; border: 0; color: var(--mut); font: 500 16px/1 var(--ui);
}
.tab-x.confirm { background: var(--stop); color: var(--run-fg); font: 600 12px var(--ui); }
.tab-input {
  width: 14ch; height: 26px; margin: 0 6px; padding: 0 6px; border-radius: 5px;
  background: var(--bg); border: 1px solid var(--accent); font: 500 13px var(--mono); color: var(--fg);
}
.tab-add {
  height: 34px; min-width: 38px; background: none; border: 0; color: var(--mut);
  display: grid; place-items: center; flex: 0 0 auto;
}

/* Touch key row */
.keys { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 0 0 auto; scrollbar-width: none; padding: 1px 0; }
.keys::-webkit-scrollbar { display: none; }
/* Autocomplete suggestions live at the start of the key row */
.sugg { display: flex; gap: 4px; flex: 0 0 auto; }
.sugg.has { padding-right: 6px; margin-right: 2px; border-right: 1px solid var(--line); }
.sug {
  flex: 0 0 auto; height: 38px; padding: 0 12px; border-radius: 7px;
  background: var(--ed); border: 1px solid var(--line); color: var(--fg);
  font: 500 15px var(--mono);
}
.sug.first { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sug:active { background: var(--bar); }
.key {
  flex: 0 0 auto; min-width: 40px; height: 38px; padding: 0 8px; border-radius: 7px;
  background: var(--bar); border: 1px solid var(--line); color: var(--fg);
  font: 500 16px var(--mono);
}
.key:active { background: var(--line); }
.key.wide { font: 600 12px var(--ui); min-width: 48px; }

/* Workspace */
.work { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.editor-pane { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; }
.editor {
  flex: 1; min-width: 0; display: flex; position: relative; overflow: hidden;
  background: var(--ed); border: 1px solid var(--line); border-radius: 8px;
}
.gutter {
  flex: 0 0 auto; width: calc(var(--digits, 2) * 1ch + 26px); overflow: hidden;
  padding: 10px 10px 120px 0; text-align: right; white-space: pre; user-select: none; -webkit-user-select: none;
  background: var(--gut); color: var(--mut); border-right: 1px solid var(--line);
  font: 400 var(--fs) / var(--lh) var(--mono); font-variant-ligatures: none;
}
.code-wrap { position: relative; flex: 1; min-width: 0; }
.curline { position: absolute; left: 0; right: 0; height: var(--lh); background: var(--cur); pointer-events: none; display: none; z-index: 0; }
.editor.focused .curline { display: block; }
.hl, .code {
  position: absolute; inset: 0; margin: 0; padding: 10px 14px 120px 12px; border: 0; border-radius: 0;
  font: 400 var(--fs) / var(--lh) var(--mono); font-variant-ligatures: none; letter-spacing: 0;
  tab-size: 4; -moz-tab-size: 4; white-space: pre; overflow-wrap: normal; word-break: normal;
}
.hl { z-index: 1; overflow: hidden; pointer-events: none; color: var(--fg); }
.code {
  z-index: 2; overflow: auto; resize: none; outline: none; background: transparent;
  color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--fg);
  -webkit-appearance: none; appearance: none;
}
.code::selection { background: var(--sel); color: transparent; }
.hl .k { color: var(--k); } .hl .s { color: var(--s); } .hl .c { color: var(--c); font-style: italic; }
.hl .n { color: var(--n); } .hl .f { color: var(--f); } .hl .t { color: var(--t); }
.hl .b { color: var(--b); } .hl .d { color: var(--d); } .hl .p { color: var(--p); }

/* Console */
.console-pane {
  flex: 0 0 38%; min-height: 132px; display: flex; flex-direction: column; min-width: 0;
  background: var(--cons); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.console-pane.collapsed { flex: 0 0 auto; min-height: 0; }
.console-pane.collapsed .cons-body { display: none; }
.cons-head {
  display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 6px 0 12px;
  background: var(--bar); border-bottom: 1px solid var(--line); cursor: pointer; flex: 0 0 auto;
}
.console-pane.collapsed .cons-head { border-bottom: 0; }
.cons-title { font: 600 12px var(--ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mut); }
.chip { font: 500 12px var(--ui); padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; color: var(--mut); white-space: nowrap; }
.chip.run { color: var(--accent); } .chip.ok { color: var(--run); } .chip.err { color: var(--stop); } .chip.warn { color: var(--warn); }
.head-btn {
  height: 32px; padding: 0 10px; border-radius: 7px; background: transparent; border: 0;
  color: var(--mut); font: 500 13px var(--ui); display: inline-grid; place-items: center;
}
.head-btn:active { background: var(--line); }
.chev { width: 8px; height: 8px; border-right: 2px solid var(--mut); border-bottom: 2px solid var(--mut); transform: translateY(-2px) rotate(45deg); transition: transform 0.15s; }
.console-pane.collapsed .chev { transform: translateY(2px) rotate(-135deg); }
.cons-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; }
.out {
  margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg);
  font: 400 var(--fs) / 1.5 var(--mono); font-variant-ligatures: none;
}
.out:empty::before { content: attr(data-empty); color: var(--mut); font-family: var(--ui); font-size: 14px; }
.out .err { color: var(--stop); } .out .mut { color: var(--mut); }
.out .in {
  width: 12ch; max-width: 100%; padding: 0 2px; margin: 0; border: 0; border-bottom: 2px solid var(--accent);
  background: transparent; color: var(--fg); font: inherit; border-radius: 0; outline: none;
}

@media (max-width: 430px) {
  .logo { display: none; }
  .sel-wrap select { width: 88px; }
  .icon-btn { min-width: 34px; }
}
@media (min-width: 560px) { .brand-name { display: inline; } }
@media (max-width: 559px) { .brand-name { display: none; } }
@media (min-width: 900px) and (orientation: landscape) {
  .work { flex-direction: row; }
  .console-pane, .console-pane.collapsed { flex: 0 0 42%; min-height: 0; }
  .console-pane.collapsed .cons-body { display: block; }
  .cons-head { cursor: default; }
  #chevron { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
/* While the on-screen keyboard is open, give the editor all the room */
html.kb .app { padding-block: 4px; gap: 4px; }
html.kb .bar, html.kb .tabs { display: none; }
/* Key + suggestion row sits right on top of the keyboard, editor fills the space above it */
html.kb .keys { order: 10; padding: 2px 0 0; }
html.kb .hl, html.kb .code { padding-bottom: 56px; }
html.kb .gutter { padding-bottom: 56px; }
.run-mini {
  display: none; flex: 0 0 auto; height: 38px; min-width: 60px; padding: 0 12px; border: 0; border-radius: 7px;
  align-items: center; justify-content: center; gap: 6px;
  background: var(--run); color: var(--run-fg); font: 600 13px var(--ui);
}
.run-mini.stop { background: var(--stop); }
.run-mini:disabled { opacity: 0.5; }
html.kb .run-mini { display: inline-flex; }
@media not all and (min-width: 900px) and (orientation: landscape) { html.kb .console-pane { display: none; } }
/* Program is waiting for input(): show only the console above the keyboard */
html.kbin .app { padding-block: 4px; gap: 4px; }
html.kbin .bar, html.kbin .tabs, html.kbin .keys, html.kbin .editor-pane { display: none; }
html.kbin .console-pane, html.kbin .console-pane.collapsed { flex: 1 1 0; min-height: 0; }
html.kbin .console-pane.collapsed .cons-body { display: block; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><linearGradient id="pcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs>
  <symbol id="pclogo" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="116" fill="url(#pcg)"/>
    <path d="M168 392V132h122a86 86 0 0 1 0 172H168" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M236 190V242L284 216Z" fill="#ffd166"/>
  </symbol>
</svg>

<div class="app" id="app">
  <header class="bar">
    <div class="brand"><svg class="logo" aria-hidden="true"><use href="#pclogo"/></svg><span class="brand-name">PyCep</span></div>
    <div class="spacer"></div>
    <label class="sel-wrap"><select id="examples" aria-label="Example programs"><option value="">Examples</option></select></label>
    <button class="icon-btn" id="fontDown" type="button" aria-label="Decrease font size">A−</button>
    <button class="icon-btn" id="fontUp" type="button" aria-label="Increase font size">A+</button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark theme"></button>
    <button class="run" id="runBtn" type="button" disabled></button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Files"></nav>
  <div class="keys" id="keys" aria-label="Extra keys"><button class="run-mini" id="runMini" type="button" aria-label="Run the program"></button><span class="sugg" id="sugg" aria-label="Suggestions"></span></div>

  <main class="work">
    <section class="editor-pane">
      <div class="editor" id="editor">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <div class="code-wrap">
          <div class="curline" id="curline"></div>
          <pre class="hl" id="hlPre" aria-hidden="true"><code id="hlCode"></code></pre>
          <textarea class="code" id="code" name="pycep-code" wrap="off" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off" inputmode="text" data-gramm="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" aria-label="Python code"></textarea>
        </div>
      </div>
    </section>

    <section class="console-pane" id="consolePane">
      <div class="cons-head" id="consHead">
        <span class="cons-title">Output</span>
        <span class="chip" id="status">Loading Python…</span>
        <span class="spacer"></span>
        <button class="head-btn" id="clearBtn" type="button">Clear</button>
        <button class="head-btn" id="chevron" type="button" aria-label="Expand or collapse the output panel" aria-expanded="true"><span class="chev"></span></button>
      </div>
      <div class="cons-body" id="consBody">
        <pre class="out" id="out" data-empty="Output will appear here. Tap Run."></pre>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- Syntax highlighting ---------- */
  /*HL-START*/
  var KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
  var BI = new Set('print input len range int float str list dict set tuple bool type isinstance sum min max abs round sorted reversed enumerate zip map filter open any all chr ord hex bin id iter next super object format repr pow divmod slice callable hasattr getattr setattr dir vars'.split(' '));
  var TOK = /((?:\b[rRbBfFuU]{1,2})?(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)))|((?:\b[rRbBfFuU]{1,2})?(?:"(?:\\.|[^"\\\n])*(?:"|(?=\n|$))|'(?:\\.|[^'\\\n])*(?:'|(?=\n|$))))|(#[^\n]*)|(@[A-Za-z_][\w.]*)|(0[xXbBoO][0-9a-fA-F_]+|\b\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?|\.\d+)|([A-Za-z_]\w*)/g;
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function highlight(src) {
    var out = '', last = 0, prev = '', m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(src)) !== null) {
      if (m.index > last) out += esc(src.slice(last, m.index));
      var t = m[0], cls = '';
      if (m[1] || m[2]) { cls = 's'; prev = ''; }
      else if (m[3]) { cls = 'c'; prev = ''; }
      else if (m[4]) { cls = 'd'; prev = ''; }
      else if (m[5]) { cls = 'n'; prev = ''; }
      else {
        if (KW.has(t)) cls = 'k';
        else if (prev === 'def') cls = 'f';
        else if (prev === 'class') cls = 't';
        else if (BI.has(t)) cls = 'b';
        else if (t === 'self' || t === 'cls') cls = 'p';
        prev = t;
      }
      out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
      last = TOK.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  /*HL-END*/

  /* ---------- Project state ---------- */
  var DEFAULT_CODE = [
    "# Welcome to PyCep!",
    "# Press the Run button (or Ctrl+Enter on a keyboard).",
    "",
    'name = input("What is your name? ")',
    'print(f"Hello, {name}!")',
    "",
    "def square(n):",
    "    return n * n",
    "",
    "for i in range(1, 6):",
    '    print("The square of", i, "is", square(i))',
    ""
  ].join('\n');

  var EXAMPLES = [
    { id: 'loops', title: 'Loops', files: [{ name: 'loops.py', code: [
      '# for and while loops',
      'total = 0',
      'for i in range(1, 11):',
      '    total += i',
      'print("Sum of 1 to 10:", total)',
      '',
      'counter = 3',
      'while counter > 0:',
      '    print("Countdown:", counter)',
      '    counter -= 1',
      'print("Go!")',
      ''].join('\n') }] },
    { id: 'lists', title: 'Lists and dicts', files: [{ name: 'lists.py', code: [
      'fruits = ["apple", "pear", "cherry"]',
      'fruits.append("grape")',
      'for f in fruits:',
      '    print(f.upper())',
      '',
      'price = {"apple": 3, "pear": 4, "cherry": 6}',
      'for item, cost in price.items():',
      '    print(item + ": $" + str(cost))',
      '',
      'squares = [x * x for x in range(1, 6)]',
      'print(squares)',
      ''].join('\n') }] },
    { id: 'class', title: 'Class', files: [{ name: 'shapes.py', code: [
      'class Rectangle:',
      '    def __init__(self, width, height):',
      '        self.width = width',
      '        self.height = height',
      '',
      '    def area(self):',
      '        return self.width * self.height',
      '',
      '    def perimeter(self):',
      '        return 2 * (self.width + self.height)',
      '',
      'r = Rectangle(5, 3)',
      'print("Area:", r.area())',
      'print("Perimeter:", r.perimeter())',
      ''].join('\n') }] },

  var skReady = false, running = false, stopReq = false, pendingInput = null;
  var runMini = $('runMini');
  var ICON_PLAY = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
  var ICON_STOP = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  function setRunUI() {
    runBtn.className = 'run' + (running ? ' stop' : '');
    runBtn.innerHTML = (running ? ICON_STOP : ICON_PLAY) + '<span>' + (running ? 'Stop' : 'Run') + '</span>';
    runBtn.disabled = !running && !skReady;
    runBtn.setAttribute('aria-label', running ? 'Stop the program' : 'Run the program');
    runMini.className = 'run-mini' + (running ? ' stop' : '');
    runMini.innerHTML = runBtn.innerHTML;
    runMini.disabled = runBtn.disabled;
  }
  setRunUI();

  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      var timer = setTimeout(function () { reject(new Error('timeout')); }, 20000);
      s.src = url;
      s.onload = function () { clearTimeout(timer); resolve(); };
      s.onerror = function () { clearTimeout(timer); reject(new Error('load')); };
      document.head.appendChild(s);
    });
  }
  function loadEngine() {
    var sets = [
      ['https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt-stdlib.js'],
      ['https://unpkg.com/skulpt@1.2.0/dist/skulpt.min.js', 'https://unpkg.com/skulpt@1.2.0/dist/skulpt-stdlib.js']
    ];
    var chain = Promise.reject();
    sets.forEach(function (pair) {
      chain = chain.catch(function () {
        return loadScript(pair[0]).then(function () { return loadScript(pair[1]); }).then(function () {
          if (!window.Sk || !Sk.builtinFiles) throw new Error('missing');
        });
      });
    });
    chain.then(function () {
      skReady = true; setStatus('Ready', 'ok'); setRunUI();
    }).catch(function () {
      setStatus('Failed to load', 'err');
      addNode('The Python engine could not be loaded. Check your internet connection and reload the page.\n', 'err');
    });
  }

  function builtinRead(x) {
    if (window.Sk && Sk.builtinFiles && Sk.builtinFiles.files[x] !== undefined) return Sk.builtinFiles.files[x];
    var base = x.replace(/^.*\//, '');
    for (var i = 0; i < state.files.length; i++) { if (state.files[i].name === base) return state.files[i].code; }
    throw "File not found: '" + x + "'";
  }
  function inputf(prompt) {
    return new Promise(function (resolve, reject) {
      if (prompt) appendOut(String(prompt));
      var inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'in';
      inp.setAttribute('autocapitalize', 'none'); inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocorrect', 'off');
      inp.name = 'pycep-input'; inp.setAttribute('data-lpignore', 'true'); inp.setAttribute('data-1p-ignore', 'true'); inp.setAttribute('data-form-type', 'other');
      inp.setAttribute('enterkeyhint', 'done'); inp.spellcheck = false;
      inp.setAttribute('aria-label', 'Program input');
      out.appendChild(inp);
      inp.addEventListener('input', function () { inp.style.width = Math.max(12, inp.value.length + 2) + 'ch'; });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var val = inp.value;
          inp.remove(); pendingInput = null;
          addNode(val + '\n'); scrollOut();
          resolve(val);
        }
      });
      pendingInput = { cancel: function () { inp.remove(); pendingInput = null; reject(new Error('__stopped__')); } };
      setCollapsed(false); scrollOut();
      setTimeout(function () { inp.focus(); }, 0);
    });
  }
  consBody.addEventListener('click', function () {
    var i = out.querySelector('input.in');
    if (i && !window.getSelection().toString()) i.focus();
  });

  function fmt(ms) { return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + ' s'; }
  function run() {
    if (running || !skReady) return;
    running = true; stopReq = false; setRunUI();
    setCollapsed(false);
    if (document.activeElement === ta) ta.blur();
    clearOut(); setStatus('Running…', 'run');
    var t0 = performance.now();
    var code = state.files[state.active].code;
    var verdict = 'ok', msg = '';
    Promise.resolve().then(function () {
      Sk.configure({
        output: appendOut, read: builtinRead, inputfun: inputf, inputfunTakesPrompt: true,
        __future__: Sk.python3, yieldLimit: 100
      });
      return Sk.misceval.asyncToPromise(function () {
        return Sk.importMainWithBody('<stdin>', false, code, true);
      }, { '*': function () { if (stopReq) throw new Error('__stopped__'); } });
    }).catch(function (err) {
      if (err && err.message === '__stopped__') verdict = 'stop';
      else { verdict = 'err'; msg = String(err); }
    }).then(function () {
      if (limitHit) verdict = 'stop';
      if (pendingInput) pendingInput.cancel();
      var dt = performance.now() - t0;
      if (lastChar !== '\n') addNode('\n');
      if (verdict === 'err') {
        addNode(msg + '\n', 'err');
        addNode('\nFinished with an error (' + fmt(dt) + ')\n', 'mut');
        setStatus('Error', 'err');
      } else if (verdict === 'stop') {
        addNode('\nStopped (' + fmt(dt) + ')\n', 'mut');
        setStatus('Stopped', 'warn');
      } else {
        addNode('\nProgram finished (' + fmt(dt) + ')\n', 'mut');
        setStatus('Done · ' + fmt(dt), 'ok');
      }
      scrollOut();
      running = false; setRunUI();
    });
  }
  function stopRun() {
    if (!running) return;
    stopReq = true;
    if (pendingInput) pendingInput.cancel();
  }
  function toggleRun() { if (running) stopRun(); else run(); }
  runBtn.addEventListener('click', toggleRun);
  runMini.addEventListener('click', toggleRun);

  /* ---------- Start ---------- */
  ta.value = state.files[state.active].code;
  refresh();
  renderTabs();
  loadEngine();
  window.addEventListener('resize', function () { updateCurLine(); });

  /* ---------- Keyboard-aware viewport (iPad / iPhone) ---------- */
  function ensureCaret() {
    if (document.activeElement !== ta) return;
    var lh = parseFloat(getComputedStyle(ta).lineHeight) || 22;
    var idx = ta.value.slice(0, ta.selectionStart).split('\n').length - 1;
    var top = 10 + idx * lh, bottom = top + lh;
    if (top < ta.scrollTop) ta.scrollTop = Math.max(0, top - lh);
    else if (bottom > ta.scrollTop + ta.clientHeight - lh) ta.scrollTop = bottom - ta.clientHeight + lh * 2;
  }
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    var fullH = 0, burstUntil = 0, raf = 0;
    function typingKind() {
      var ae = document.activeElement;
      if (ae === ta) return 'kb';
      if (ae && ae.classList && ae.classList.contains('in')) return 'kbin';
      return '';
    }
    function fit() {
      var kind = typingKind(), h = vv.height;
      if (!kind) fullH = h; else if (h > fullH) fullH = h;
      var open = kind && isCoarse() && (window.innerHeight - h > 100 || fullH - h > 100 || h < 400);
      root.style.setProperty('--vvh', Math.round(h) + 'px');
      root.style.setProperty('--vvt', Math.round(vv.offsetTop) + 'px');
      root.classList.toggle('kb', !!open && kind === 'kb');
      root.classList.toggle('kbin', !!open && kind === 'kbin');
      updateCurLine();
      if (open && kind === 'kbin') consBody.scrollTop = consBody.scrollHeight;
    }
    function tick() {
      raf = 0; fit();
      if (performance.now() < burstUntil) raf = requestAnimationFrame(tick);
      else ensureCaret();
    }
    function burst() { burstUntil = performance.now() + 900; if (!raf) raf = requestAnimationFrame(tick); }
    vv.addEventListener('resize', burst);
    vv.addEventListener('scroll', burst);
    window.addEventListener('orientationchange', function () { fullH = 0; burst(); });
    document.addEventListener('focusin', burst);
    document.addEventListener('focusout', function () { setTimeout(burst, 50); });
    ta.addEventListener('input', ensureCaret);
    fit();
  })();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
